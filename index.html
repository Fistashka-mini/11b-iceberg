<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>11-Б · Айсберг одноклассников</title>
    <meta name="description" content="Айсберг одноклассников 11-Б, 2016 — 2027" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-Cng-2Rv0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CpIoDaMn.css">
  </head>
  <body>
    <div id="loader">
      <div class="loader-ice"></div>
      <span>Замораживаем айсберг…</span>
    </div>

    <canvas id="scene"></canvas>
    <div id="scroller"></div>
    <div id="vignette"></div>

    <header id="hero">
      <p class="hero-kicker" data-field="subtitle">Айсберг одноклассников</p>
      <h1 class="hero-title" data-field="title">11-Б</h1>
      <p class="hero-years" data-field="years">2016 — 2027</p>
      <div class="hero-hint">
        <span>Листай вниз</span>
        <i></i>
      </div>
    </header>

    <div id="tiers"></div>

    <aside id="depth">
      <span class="depth-label">глубина</span>
      <span id="depth-value">0 м</span>
    </aside>

    <div id="toolbar">
      <button id="articles-btn" type="button">Статьи</button>
      <button id="add-btn" type="button">+ Добавить</button>
      <button id="archive-btn" type="button" hidden>Архив</button>
    </div>

    <!-- статьи: читают все, пишут только модеры -->
    <section id="articles" hidden>
      <div class="archive-backdrop" data-articles-close></div>
      <article class="archive-card articles-card" role="dialog" aria-modal="true">
        <button class="archive-close" data-articles-close aria-label="Закрыть">✕</button>
        <header class="archive-head">
          <p class="archive-kicker">Истории класса</p>
          <h2>Статьи</h2>
          <p class="archive-meta">Про людей с айсберга · фото + текст</p>
        </header>
        <div class="articles-toolbar">
          <button type="button" id="article-write-btn" class="btn-save" hidden>Написать статью</button>
        </div>
        <div id="articles-list" class="articles-list"></div>
        <div id="article-reader" class="article-reader" hidden></div>
        <form id="article-form" class="profile-edit article-form" hidden>
          <label>
            О ком статья
            <select name="personId" required></select>
          </label>
          <label>
            Заголовок
            <input name="title" maxlength="80" required placeholder="Короткий заголовок" />
          </label>
          <label>
            Текст
            <textarea name="body" rows="6" maxlength="450" required placeholder="Текст статьи…"></textarea>
            <span class="char-count"><b data-count="abody">0</b>/450</span>
          </label>
          <label class="photo-field">
            Фото (макс. 1)
            <div class="photo-row">
              <img class="photo-preview" alt="" hidden />
              <input type="file" name="photo" accept="image/*" />
              <button type="button" class="btn-photo-clear" data-art-photo-clear>Убрать</button>
            </div>
          </label>
          <label>
            Твоё имя
            <input name="editor" maxlength="40" placeholder="кто пишет" />
          </label>
          <div class="edit-actions">
            <button type="button" class="btn-cancel" data-art-cancel>Отмена</button>
            <button type="submit" class="btn-save">Опубликовать</button>
          </div>
          <p class="edit-status" hidden></p>
        </form>
      </article>
    </section>

    <!-- архив = лог изменений (только владелец по IP) -->
    <section id="archive" hidden>
      <div class="archive-backdrop" data-archive-close></div>
      <article class="archive-card" role="dialog" aria-modal="true">
        <button class="archive-close" data-archive-close aria-label="Закрыть">✕</button>
        <header class="archive-head">
          <p class="archive-kicker">Только для тебя · по IP</p>
          <h2>Архив изменений</h2>
          <p class="archive-meta">Лог правок — можно восстановить удалённый текст</p>
        </header>
        <div id="archive-list" class="log-list"></div>
      </article>
    </section>

    <div id="tooltip" hidden></div>

    <!-- карточка одноклассника -->
    <section id="profile" hidden>
      <div class="profile-backdrop" data-close></div>
      <article class="profile-card" role="dialog" aria-modal="true">
        <button class="profile-close" data-close aria-label="Закрыть">✕</button>

        <header class="profile-head">
          <div class="profile-avatar"><img alt="" /></div>
          <div class="profile-titles">
            <p class="profile-tier"></p>
            <h2 class="profile-name"></h2>
            <p class="profile-nick"></p>
          </div>
        </header>

        <div class="profile-view">
          <div class="profile-about"></div>
          <ul class="profile-facts"></ul>
          <div class="profile-gallery"></div>
          <div class="profile-actions">
            <button type="button" class="btn-edit">Редактировать</button>
          </div>
        </div>

        <form class="profile-edit" hidden>
          <label>
            Имя
            <input name="name" maxlength="40" required />
          </label>
          <label>
            Подпись
            <input name="nickname" maxlength="80" placeholder="необязательно" />
          </label>
          <label class="mod-only">
            Раздел (глубина)
            <select name="tier"></select>
            <span class="photo-hint">Глубину меняют только модераторы</span>
          </label>
          <label class="photo-field">
            Фото на аватаре
            <div class="photo-row">
              <img class="photo-preview" alt="" hidden />
              <input type="file" name="photo" accept="image/*" />
              <button type="button" class="btn-photo-clear">Убрать фото</button>
            </div>
            <span class="photo-hint">jpg / png / webp — сожмётся само, увидят все</span>
          </label>
          <label>
            Описание
            <textarea name="about" rows="5" maxlength="450" placeholder="Истории, мемы, легенды…"></textarea>
            <span class="char-count"><b data-count="about">0</b>/450</span>
          </label>
          <label>
            Факты (каждый с новой строки)
            <textarea name="facts" rows="3" placeholder="Один факт — одна строка"></textarea>
          </label>
          <label>
            Твоё имя в логе
            <input name="editor" maxlength="40" placeholder="кто правит (для архива)" />
          </label>
          <div class="edit-actions">
            <button type="button" class="btn-cancel">Отмена</button>
            <button type="button" class="btn-clear">Очистить описание</button>
            <button type="submit" class="btn-save">Сохранить</button>
          </div>
          <p class="edit-status" hidden></p>
        </form>

        <footer class="profile-nav">
          <button class="profile-prev"><span>←</span><b></b></button>
          <button class="profile-next"><b></b><span>→</span></button>
        </footer>
      </article>
    </section>

    <!-- добавить нового -->
    <section id="add-modal" hidden>
      <div class="archive-backdrop" data-add-close></div>
      <article class="archive-card add-card" role="dialog" aria-modal="true">
        <button class="archive-close" data-add-close aria-label="Закрыть">✕</button>
        <header class="archive-head">
          <p class="archive-kicker">Новый одноклассник</p>
          <h2>Добавить на айсберг</h2>
        </header>
        <form id="add-form" class="profile-edit" style="display: grid">
          <label>
            Имя
            <input name="name" maxlength="40" required placeholder="как на айсберге" />
          </label>
          <label class="mod-only">
            Раздел (глубина)
            <select name="tier"></select>
          </label>
          <label>
            Подпись
            <input name="nickname" maxlength="80" placeholder="необязательно" />
          </label>
          <label class="photo-field">
            Фото на аватаре
            <div class="photo-row">
              <img class="photo-preview" alt="" hidden />
              <input type="file" name="photo" accept="image/*" />
            </div>
          </label>
          <label>
            Описание
            <textarea name="about" rows="4" maxlength="450"></textarea>
          </label>
          <label>
            Твоё имя в логе
            <input name="editor" maxlength="40" placeholder="кто добавляет" />
          </label>
          <div class="edit-actions">
            <button type="button" data-add-close class="btn-cancel">Отмена</button>
            <button type="submit" class="btn-save">Добавить</button>
          </div>
          <p class="edit-status" hidden></p>
        </form>
      </article>
    </section>

  </body>
</html>
